<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UA Deck Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:system-ui,"Noto Sans TC",sans-serif}.app{max-width:1180px;margin:auto;padding:24px}.top,.tabs,.actions{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b,.score{color:#ffb020}button,input,select{font:inherit}.btn,.tabs button,input,select{border:1px solid #2a3140;background:#141821;color:#f5f7fb;padding:10px 13px;border-radius:11px}.btn,.tabs button{cursor:pointer}.active,.primary{background:#ffb020!important;color:#17120a!important;font-weight:800}.hero,.panel{border:1px solid #2a3140;background:#141821;border-radius:18px}.hero{margin:20px 0;padding:26px;background:linear-gradient(135deg,#171b25,#242a39)}.hero h1{margin:0 0 8px}.muted,.meta{color:#9aa5b5}.grid{display:grid;grid-template-columns:1.5fr .9fr;gap:18px}.panel{padding:18px}.toolbar{display:grid;grid-template-columns:1fr 140px 160px;gap:9px;margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.rec{background:#1b2130;border:1px solid #2a3140;border-radius:13px;padding:13px}.card{cursor:pointer}.art{height:120px;border-radius:9px;display:grid;place-items:center;font-size:20px;font-weight:900;background:linear-gradient(135deg,#8b1e1e,#321111);margin-bottom:10px}.blue{background:linear-gradient(135deg,#2457a6,#101b35)}.green{background:linear-gradient(135deg,#267348,#10291d)}.tag{display:inline-block;font-size:11px;padding:4px 7px;margin:4px 3px 0 0;border-radius:99px;background:#2a3140}.deckrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #2a3140;padding:10px 0}.score{font-size:34px;font-weight:900}.hidden{display:none}.empty{text-align:center;padding:32px;color:#9aa5b5}.rec{margin:10px 0}.footer{text-align:center;color:#657084;padding:25px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><div class="top"><div class="brand">UA <b>DECK LAB</b></div><div class="tabs"><button class="active" data-view="browse">卡片資料庫</button><button data-view="deck">我的卡組 <span id="count">0</span></button><button data-view="recommend">智能推薦</button></div></div><section class="hero"><h1>找卡、組牌、發現搭配。</h1><div class="muted">UNION ARENA Deck Builder MVP：搜尋、組牌、牌組健檢與可解釋的搭配推薦。</div></section>
<section id="browse" class="view"><div class="grid"><div class="panel"><div class="toolbar"><input id="q" placeholder="搜尋卡名、特徵、效果…"><select id="color"><option value="">全部顏色</option><option>紅</option><option>藍</option><option>綠</option></select><select id="series"><option value="">全部作品</option><option>鏈鋸人</option><option>咒術迴戰</option></select></div><div id="cards" class="cards"></div></div><div id="detail" class="panel"><div class="empty">點選卡片查看詳細資料</div></div></div></section>
<section id="deck" class="view hidden"><div class="grid"><div class="panel"><h2>我的卡組</h2><div class="muted">目標 50 張，單卡最多 4 張。</div><div id="deckList"></div></div><div class="panel"><h2>牌組健檢</h2><div id="health"></div></div></div></section>
<section id="recommend" class="view hidden"><div class="grid"><div class="panel"><h2>選擇核心卡</h2><select id="seed" style="width:100%"></select><button id="run" class="btn primary" style="margin-top:10px">產生推薦</button><div id="recs"></div></div><div class="panel"><h2>推薦邏輯</h2><p class="muted">同色 +25、同作品 +25、共同特徵 +15、共同效果方向 +10。正式版可加入實戰牌表共現率、勝率與能源曲線。</p></div></div></section><div class="footer">Prototype — 示範資料，不含官方卡圖或第三方翻譯資料。</div></main><script>
const cards=[
{id:'CSM-001',name:'電次',series:'鏈鋸人',color:'紅',cost:2,bp:2500,traits:['公安','鏈鋸人'],fx:['快攻','展開'],text:'登場時：符合條件時獲得進攻加成。'},
{id:'CSM-002',name:'鏈鋸人',series:'鏈鋸人',color:'紅',cost:4,bp:4000,traits:['鏈鋸人'],fx:['快攻','突破'],text:'攻擊時：符合條件時提升 BP。'},
{id:'CSM-003',name:'帕瓦',series:'鏈鋸人',color:'紅',cost:2,bp:2500,traits:['魔人','公安'],fx:['展開','抽牌'],text:'登場時：依場面條件取得資源。'},
{id:'CSM-004',name:'早川秋',series:'鏈鋸人',color:'紅',cost:3,bp:3500,traits:['公安'],fx:['控制','展開'],text:'登場時：干擾對手並支援公安角色。'},
{id:'CSM-005',name:'姬野',series:'鏈鋸人',color:'紅',cost:3,bp:3000,traits:['公安'],fx:['抽牌','控制'],text:'特定條件下產生額外資源。'},
{id:'JJK-001',name:'虎杖悠仁',series:'咒術迴戰',color:'藍',cost:2,bp:2500,traits:['咒術師'],fx:['快攻','展開'],text:'低費用展開核心。'},
{id:'JJK-002',name:'五條悟',series:'咒術迴戰',color:'藍',cost:5,bp:5000,traits:['咒術師'],fx:['控制','終結'],text:'高費用終結角色。'},
{id:'JJK-003',name:'伏黑惠',series:'咒術迴戰',color:'藍',cost:3,bp:3000,traits:['咒術師'],fx:['控制','抽牌'],text:'提供中期資源與場面控制。'},
{id:'JJK-004',name:'釘崎野薔薇',series:'咒術迴戰',color:'綠',cost:3,bp:3500,traits:['咒術師'],fx:['突破','快攻'],text:'偏進攻型角色。'}];
let deck={};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function render(){let q=$('#q').value.toLowerCase(),co=$('#color').value,se=$('#series').value,a=cards.filter(x=>(!co||x.color===co)&&(!se||x.series===se)&&(!q||[x.name,x.series,x.text,...x.traits,...x.fx].join(' ').toLowerCase().includes(q)));$('#cards').innerHTML=a.map(x=>`<div class="card" onclick="detail('${x.id}')"><div class="art ${x.color==='藍'?'blue':x.color==='綠'?'green':''}">${x.name}</div><div class="meta">${x.id} · ${x.series}</div><b>${x.name}</b><div>${x.traits.map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div>`).join('')||'<div class="empty">沒有符合條件的卡片</div>'}
function detail(id){let x=cards.find(c=>c.id===id);$('#detail').innerHTML=`<div class="meta">${x.id} · ${x.series}</div><h2>${x.name}</h2><div>${x.fx.map(t=>'<span class="tag">'+t+'</span>').join('')}</div><p>能源 <b>${x.cost}</b>　BP <b>${x.bp}</b>　顏色 <b>${x.color}</b></p><p>${x.text}</p><button class="btn primary" onclick="add('${x.id}')">加入卡組</button> <button class="btn" onclick="goRec('${x.id}')">推薦搭配</button>`}
function add(id){deck[id]=Math.min(4,(deck[id]||0)+1);deckUI()}function sub(id){deck[id]--;if(deck[id]<=0)delete deck[id];deckUI()}
function deckUI(){let es=Object.entries(deck),n=Object.values(deck).reduce((a,b)=>a+b,0);$('#count').textContent=n;$('#deckList').innerHTML=es.map(([id,n])=>{let x=cards.find(c=>c.id===id);return `<div class="deckrow"><div><b>${x.name}</b><div class="meta">${x.id} · ${x.cost} energy</div></div><b>×${n}</b><div><button class="btn" onclick="add('${id}')">+</button> <button class="btn" onclick="sub('${id}')">−</button></div></div>`}).join('')||'<div class="empty">尚未加入卡片</div>';let avg=n?es.reduce((s,[id,q])=>s+cards.find(c=>c.id===id).cost*q,0)/n:0;$('#health').innerHTML=`<div class="score">${n}/50</div><p>${n===50?'✓ 張數完成':'還需要 '+(50-n)+' 張'}</p><p>平均能源：<b>${avg.toFixed(1)}</b></p>`}
function syn(a,b){let s=0,r=[];if(a.color===b.color){s+=25;r.push('同色')}if(a.series===b.series){s+=25;r.push('同作品')}let t=a.traits.filter(x=>b.traits.includes(x));s+=t.length*15;if(t.length)r.push('共同特徵 '+t.join('/'));let f=a.fx.filter(x=>b.fx.includes(x));s+=f.length*10;if(f.length)r.push('效果方向 '+f.join('/'));return{score:s,reasons:r}}
function rec(){let a=cards.find(c=>c.id===$('#seed').value),list=cards.filter(b=>b.id!==a.id).map(b=>({b,...syn(a,b)})).sort((x,y)=>y.score-x.score).slice(0,5);$('#recs').innerHTML='<h3>與「'+a.name+'」搭配</h3>'+list.map(x=>`<div class="rec"><b>${x.b.name}</b> <span class="tag">${x.score} 分</span><div class="muted">${x.reasons.join(' · ')||'補充不同定位'}</div><button class="btn" onclick="add('${x.b.id}')">加入卡組</button></div>`).join('')}
function goRec(id){show('recommend');$('#seed').value=id;rec()}function show(id){$$('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));$$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='deck')deckUI()}
$$('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.view));['q','color','series'].forEach(id=>$('#'+id).oninput=render);$('#seed').innerHTML=cards.map(x=>`<option value="${x.id}">${x.series}｜${x.name}</option>`).join('');$('#run').onclick=rec;render();deckUI();
</script></body></html>
